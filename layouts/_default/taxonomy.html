{{ define "main" }}
<div class="page-head">
  <h1>{{ .Title }}</h1>
  <p class="page-desc">이 태그가 달린 글 {{ len .Pages }}개</p>
</div>
<div class="post-list">
  {{- $paginator := .Paginate .Pages }}
  {{- range $paginator.Pages }}
    {{ partial "post-item.html" . }}
  {{- end }}
</div>
{{ partial "pagination.html" . }}
{{ end }}
