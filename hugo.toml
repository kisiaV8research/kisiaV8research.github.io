# ─────────────────────────────────────────────────────────────
#  팀 연구 블로그 설정 파일
#  처음 세팅할 때 아래 ❶ ❷ 두 곳만 본인 팀 정보로 바꾸면 됩니다.
# ─────────────────────────────────────────────────────────────

# ❶ 팀 Organization 주소로 바꾸세요. (예: https://my-research-team.github.io/)
#    끝에 슬래시(/)를 꼭 붙이세요.
baseURL = "https://kisiav8research.github.io/"

# ❷ 블로그 제목
title = "Research Notes"

locale = "ko-kr"
defaultContentLanguage = "ko"
enableRobotsTXT = true
enableGitInfo = true          # 글 하단에 '마지막 수정일'을 Git 기록에서 자동 표기
summaryLength = 40
timeZone = "Asia/Seoul"

[pagination]
  pagerSize = 8

# ── 마크다운 렌더링 ──────────────────────────────────────────
[markup]
  [markup.goldmark.renderer]
    unsafe = true             # 마크다운 안에서 HTML 사용 허용 (임베드 등)
  [markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
      block = true
      title = true
  [markup.highlight]
    noClasses = true          # 코드 하이라이트를 인라인 스타일로 (별도 설정 불필요)
    style = "github"
    tabWidth = 2
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

# ── 상단 메뉴 ────────────────────────────────────────────────
[menu]
  [[menu.main]]
    name = "팀 글"
    pageRef = "/posts"
    weight = 10
  [[menu.main]]
    name = "멤버"
    pageRef = "/members"
    weight = 20
  [[menu.main]]
    name = "태그"
    pageRef = "/tags"
    weight = 30
  [[menu.main]]
    name = "소개"
    pageRef = "/about"
    weight = 40

# ── 사이트 전역 변수 ─────────────────────────────────────────
[params]
  description = ""
  author = "Research Team"
  # 푸터에 넣을 GitHub Organization 주소 (선택)
  github = "https://github.com/kisiaV8research"
  dateFormat = "2006년 1월 2일"

  # ── 메인(첫 화면) 꾸미기 ───────────────────────────────
  # 큰 제목 위에 작게 뜨는 라벨
  eyebrow = "KISIA · V8 RESEARCH ARCHIVE"
  # 제목 아래 큼직하게 뜨는 키워드들 (문장 대신 단어). 팀에 맞게 바꾸세요.
  # 비워두면(= []) 키워드 칩이 표시되지 않습니다.
  keywords = []

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
